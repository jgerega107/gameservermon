apiVersion: v1
kind: Service
metadata:
  name: minecraft-server
  labels:
    app: minecraft
spec:
  type: LoadBalancer
  ports:
  - port: 25565
    targetPort: 25565
    name: minecraft
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: minecraft
---
apiVersion: v1
kind: Pod
metadata:
  name: minecraft-server
  labels:
    app: minecraft
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  containers:
  # Main game server container
  - name: minecraft
    image: itzg/minecraft-server
    ports:
    - containerPort: 25565
      name: minecraft
    env:
    - name: EULA
      value: "TRUE"
    - name: ONLINE_MODE
      value: "FALSE"
    - name: TYPE
      value: "PAPER"
    volumeMounts:
    - name: data
      mountPath: /data
  
  # Monitoring sidecar container
  - name: monitor
    image: gameservermon:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 9090
      name: metrics
    env:
    - name: GAME_TYPE
      value: "minecraft"
    - name: GAME_HOST
      value: "localhost"
    - name: GAME_PORT
      value: "25565"
    - name: SCRAPE_INTERVAL
      value: "30000"
    - name: HTTP_PORT
      value: "9090"
  
  volumes:
  - name: data
    emptyDir: {}
