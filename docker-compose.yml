services:
  # Example Minecraft server
  server:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
    ports:
      - "25565:25565"

  # Game server monitor sidecar
  monitor:
    build: .
    environment:
      GAME_TYPE: "minecraft"
      GAME_HOST: "server"
      GAME_PORT: "25565"
      HTTP_PORT: "9090"
    ports:
      - "9090:9090"
    depends_on:
      - server
